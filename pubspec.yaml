name: patient_care_app
description: A patient companion app - prescription scanning, medicine reminders, appointment alerts, and a safety-first health chatbot.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Notifications & scheduling
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  # Real ringing alarms (full-screen + sound) - used for medicine/appointment
  # reminders instead of flutter_local_notifications' background-scheduled
  # notifications, which proved unreliable across multiple Android OEMs
  # (MIUI and Samsung One UI both silently suppressed them). See
  # notification_service.dart for the full explanation.
  alarm: ^5.0.0

  # Prescription photo capture + on-device OCR
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  permission_handler: ^11.3.1

  # Save prescription/report images to the phone's photo gallery from
  # the fullscreen viewer (handles Android/iOS permissions internally)
  gal: ^2.3.2

  # Networking (for chatbot / AI parsing backend calls)
  http: ^1.2.1

  # Voice input for the chatbot
  speech_to_text: ^7.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.5
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/alarm.mp3
    - assets/sounds/medicine_reminder.mp3
    - assets/sounds/appointment_reminder.mp3
